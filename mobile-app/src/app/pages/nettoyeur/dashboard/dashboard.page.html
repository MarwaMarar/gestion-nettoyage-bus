<ion-menu contentId="cleaner-main-content" type="overlay">
  <ion-header>
    <ion-toolbar>
      <ion-title>Navigation</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list lines="none">
      <ion-menu-toggle autoHide="false">
        <ion-item routerLink="/dashboard" detail="false">
          <ion-icon name="bus-outline" slot="start"></ion-icon>
          <ion-label>Accueil</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle autoHide="false">
        <ion-item routerLink="/notifications" detail="false">
          <ion-icon name="notifications-outline" slot="start"></ion-icon>
          <ion-label>Historique</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>ALSA Clean Fleet</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="cleaner-main-content">
  <main class="dashboard-page">
    <section class="welcome-card">
      <div class="welcome-top">
        <div class="welcome-text">
          <h2>Bonjour</h2>
          <h1>Nettoyeur</h1>
          <p>Choisissez un bus puis un type de nettoyage.</p>

          <div class="today">
            <ion-icon name="calendar-clear-outline"></ion-icon>
            <span>{{ today }}</span>
          </div>
        </div>

        <div class="notification-btn" routerLink="/notifications">
          <ion-icon name="notifications-outline"></ion-icon>
          <span class="badge">{{ notificationCount }}</span>
        </div>

        <img
          src="assets/images/alsa-logo.png"
          alt="ALSA Logo"
          class="logo">
      </div>
    </section>

    <section class="form-card">
      <h3>Commencer un nettoyage</h3>

      <div class="input-group">
        <label class="input-label">
          <div class="icon-box">
            <ion-icon name="bus-outline"></ion-icon>
          </div>
          <span>Bus</span>
        </label>

        <ion-item lines="none" class="custom-item">
          <ion-select
            interface="action-sheet"
            placeholder="Sélectionner un bus"
            [(ngModel)]="selectedBus">
            <ion-select-option
              *ngFor="let bus of busList"
              [value]="bus.id">
              {{ bus.numeroBus }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <div class="input-group">
        <label class="input-label">
          <div class="icon-box">
            <ion-icon name="sparkles-outline"></ion-icon>
          </div>
          <span>Type de nettoyage</span>
        </label>

        <ion-item lines="none" class="custom-item">
          <ion-select
            interface="action-sheet"
            placeholder="Sélectionner un type"
            [(ngModel)]="selectedType">
            <ion-select-option
              *ngFor="let type of typeNettoyageList"
              [value]="type.id">
              {{ type.libelle }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <ion-button
        expand="block"
        class="start-btn"
        [disabled]="loading"
        (click)="commencerNettoyage()">
        <ion-icon slot="start" name="play-circle-outline"></ion-icon>
        {{ loading ? 'Démarrage…' : 'Commencer le nettoyage' }}
      </ion-button>
    </section>
  </main>
</ion-content>
