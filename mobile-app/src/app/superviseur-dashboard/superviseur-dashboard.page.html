<ion-content [fullscreen]="true">

  <div class="dashboard-page">

    <!-- ===========================
          WELCOME
    ============================ -->

    <div class="welcome-card">

      <div class="welcome-text">

        <h2>Bonjour</h2>

        <h1>Superviseur</h1>

        <p>
          Consultez les nettoyages en attente de validation.
        </p>

      </div>

      <img
        src="assets/images/alsa-logo.png"
        alt="ALSA Logo"
        class="logo">

    </div>

    <!-- ===========================
          CARD STATISTIQUE
    ============================ -->

    <div class="stats-card">

      <div class="stats-icon">

        <ion-icon name="hourglass-outline"></ion-icon>

      </div>

      <h3>{{ totalEnAttente }}</h3>

      <p>Nettoyages en attente</p>

    </div>

    <!-- ===========================
          BUTTON
    ============================ -->

    <ion-button

      expand="block"

      class="details-btn"

      (click)="voirDetails()">

      <ion-icon
        slot="start"
        name="eye-outline">
      </ion-icon>

      Voir les détails

    </ion-button>

  </div>

</ion-content>
