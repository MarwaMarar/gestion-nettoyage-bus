<app-global-dynamic-background />
<div class="layout" [class.layout-login]="!showAppLayout()">

  @if (showAppLayout()) {
    <!-- Overlay sur mobile -->
    <div class="sidebar-overlay" 
         *ngIf="layoutService.sidebarOpen()" 
         (click)="layoutService.closeSidebar()">
    </div>

    <app-barre-laterale></app-barre-laterale>
  }

  <div class="contenu-principal" [class.no-sidebar]="!showAppLayout()">

    @if (showAppLayout()) {
      <app-barre-superieure></app-barre-superieure>
    }

    <div class="page">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
