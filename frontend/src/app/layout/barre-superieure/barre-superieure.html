<div class="navbar">

  <!-- Partie gauche -->
<div class="navbar-left">

    <button class="navbar-icon-btn mobile-menu-btn" (click)="layoutService.toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <span class="navbar-title">
      ALSA Clean Fleet
    </span>

    <span class="navbar-sep">
      /
    </span>

    <span class="navbar-subtitle">
      Système de gestion de flotte
    </span>

  </div>



  <!-- Recherche -->
  <div class="navbar-search">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      type="text"
      placeholder="Recherche rapide..." />

  </div>




  <!-- Partie droite -->
  <div class="navbar-right">


    <!-- Notifications -->
    <div class="navbar-notification" (click)="$event.stopPropagation()">

      <button
        class="navbar-icon-btn"
        title="Notifications"
        (click)="ouvrirNotifications()">

        <i class="fa-regular fa-bell"></i>

        <span *ngIf="nombreNonLues > 0" class="notif-dot"></span>

      </button>



      <!-- Menu notifications -->
      <div
        class="notification-menu"
        *ngIf="notificationsOuvert">


        <div class="notification-menu-header">
          <h4>Notifications</h4>
          <div class="notification-global-actions" *ngIf="notifications.length > 0">
            <button type="button" (click)="marquerToutesLues()" [disabled]="nombreNonLues === 0 || traitementNotifications" title="Tout marquer comme lu"><i class="fa-solid fa-check-double"></i></button>
            <button type="button" class="delete-all" (click)="supprimerToutes()" [disabled]="traitementNotifications" title="Tout supprimer"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>


        <div class="notification-feedback success" *ngIf="notificationMessage">{{ notificationMessage }}</div>
        <div class="notification-feedback error" *ngIf="notificationError">{{ notificationError }}</div>
        <div class="notification-list">
        <div class="notification-item" *ngFor="let notification of notificationsAffichees"
             (click)="lireNotification(notification)" [class.notification-read]="notification.lue">
          <i class="fa-solid fa-bell"></i><span>{{ notification.message }}</span>
          <button type="button" class="notification-delete" title="Supprimer"
                  [disabled]="deletingNotificationId === notification.id"
                  (click)="supprimerNotification($event, notification)">
            <i class="fa-solid fa-trash"></i><span>Supprimer</span>
          </button>
        </div>
        <div class="notification-item" *ngIf="notifications.length === 0">
          <span>Aucune notification</span>
        </div>
        </div>
        <button type="button" class="notifications-voir-tout" *ngIf="notifications.length > 3"
                (click)="toutesNotificationsAffichees = !toutesNotificationsAffichees">
          <i class="fa-solid" [class.fa-chevron-down]="!toutesNotificationsAffichees" [class.fa-chevron-up]="toutesNotificationsAffichees"></i>
          {{ toutesNotificationsAffichees ? 'Voir moins' : 'Voir tout (' + notifications.length + ')' }}
        </button>


      </div>


    </div>





    <!-- Profil Admin -->
    <div
      class="navbar-profile"
      (click)="$event.stopPropagation(); ouvrirProfil()">


      <div class="navbar-avatar">{{ initiales }}</div>



      <div class="navbar-profile-info">

        <span class="navbar-profile-name">
          {{ nomAffiche }}
        </span>


        <span class="navbar-profile-role">
          {{ roleAffiche }}
        </span>

      </div>



      <i
        class="fa-solid fa-chevron-down"
        style="font-size:10px;color:var(--text-muted);margin-left:2px">
      </i>





      <!-- Menu Profil -->
      <div
        class="profile-menu"
        *ngIf="profilOuvert">


      <div class="profile-menu-item" (click)="allerProfil()">

        <i class="fa-solid fa-user"></i>
          Mon profil

      </div>


       <div *ngIf="utilisateur?.role === 'ADMINISTRATEUR'" class="profile-menu-item"(click)="allerParametres()">
        <i class="fa-solid fa-gear"></i>
         Paramètres

       </div>



       <div class="profile-menu-item logout"(click)="deconnexion()">

       <i class="fa-solid fa-right-from-bracket"></i>
       Déconnexion

       </div>


      </div>



    </div>


  </div>


</div>
<app-confirmation-dialog *ngIf="notificationASupprimer" titre="Supprimer cette notification ?"
  message="Cette notification sera supprimée définitivement."
  libelleConfirmation="Supprimer" icone="fa-trash" [chargement]="deletingNotificationId !== null"
  (annuler)="notificationASupprimer = null" (confirmer)="confirmerSuppressionNotification()" />
