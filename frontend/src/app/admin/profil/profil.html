<div class="profil" *ngIf="utilisateur as user">
  <div class="header-page"><div class="header-page-left"><h2><i class="fa-solid fa-user"></i> Mon Profil</h2><p>Gestion de mes informations personnelles</p></div></div>
  <div class="profil-card">
    <div class="profil-top"><div class="profil-avatar">{{ initiales }}</div><div class="profil-name"><h3>{{ nomComplet }}</h3><span>{{ roleAffiche }}</span></div></div>
    <div class="profil-feedback success" *ngIf="message">{{ message }}</div><div class="profil-feedback error" *ngIf="erreur">{{ erreur }}</div>
    <form class="form-card" *ngIf="modifierOuvert" (ngSubmit)="sauvegarderProfil()">
      <h3>Modifier mes informations</h3><div class="form-grid"><div class="form-group"><label>Prénom</label><input name="prenom" [(ngModel)]="prenom" required></div><div class="form-group"><label>Nom</label><input name="nom" [(ngModel)]="nom" required></div></div>
      <div class="form-group"><label>Email</label><input name="email" type="email" [(ngModel)]="email" required></div><div class="form-group"><label>Téléphone</label><input name="telephone" type="tel" [(ngModel)]="telephone"></div>
      <div class="form-buttons"><button class="btn-save" type="submit" [disabled]="chargement">{{chargement?'Enregistrement...':'Enregistrer'}}</button><button class="btn-cancel" type="button" (click)="fermer()" [disabled]="chargement">Annuler</button></div>
    </form>
    <form class="form-card" *ngIf="motDePasseOuvert" (ngSubmit)="changerMotDePasse()">
      <h3>Changer le mot de passe</h3>
      <input class="password-manager-login" name="username" type="text"
             [value]="user.login" autocomplete="username" readonly tabindex="-1" aria-hidden="true">
      <div class="form-group"><label>Ancien mot de passe</label><div class="password-box"><input name="ancien" [type]="voirAncien?'text':'password'" [(ngModel)]="ancienMotDePasse" required autocomplete="current-password"><i class="fa-solid" [class.fa-eye]="!voirAncien" [class.fa-eye-slash]="voirAncien" (click)="toggleAncien()"></i></div></div>
      <div class="form-group"><label>Nouveau mot de passe</label><div class="password-box"><input name="nouveau" [type]="voirNouveau?'text':'password'" [(ngModel)]="nouveauMotDePasse" required autocomplete="new-password"><i class="fa-solid" [class.fa-eye]="!voirNouveau" [class.fa-eye-slash]="voirNouveau" (click)="toggleNouveau()"></i></div></div>
      <div class="form-group"><label>Confirmer mot de passe</label><div class="password-box"><input name="confirmation" [type]="voirConfirmation?'text':'password'" [(ngModel)]="confirmerMotDePasse" required autocomplete="new-password"><i class="fa-solid" [class.fa-eye]="!voirConfirmation" [class.fa-eye-slash]="voirConfirmation" (click)="toggleConfirmation()"></i></div></div>
      <div class="form-buttons"><button class="btn-save" type="submit" [disabled]="chargement">{{chargement?'Modification...':'Modifier'}}</button><button class="btn-cancel" type="button" (click)="fermer()" [disabled]="chargement">Annuler</button></div>
    </form>
    <div class="profil-info">
      <div class="info-item"><i class="fa-solid fa-user"></i><div><label>Nom complet</label><p>{{nomComplet}}</p></div></div><div class="info-item"><i class="fa-solid fa-envelope"></i><div><label>Email</label><p>{{user.email}}</p></div></div>
      <div class="info-item"><i class="fa-solid fa-phone"></i><div><label>Téléphone</label><p>{{user.telephone||'Non renseigné'}}</p></div></div><div class="info-item"><i class="fa-solid fa-id-badge"></i><div><label>Matricule</label><p>{{user.matricule}}</p></div></div>
      <div class="info-item"><i class="fa-solid fa-shield-halved"></i><div><label>Rôle</label><p>{{roleAffiche}}</p></div></div>
    </div>
    <div class="profil-actions"><button class="btn-modifier" type="button" (click)="ouvrirModifier()"><i class="fa-solid fa-pen"></i> Modifier profil</button><button class="btn-password" type="button" (click)="ouvrirMotDePasse()"><i class="fa-solid fa-lock"></i> Changer mot de passe</button></div>
  </div>
</div>
