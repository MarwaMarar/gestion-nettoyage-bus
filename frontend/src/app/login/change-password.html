<div class="login-page"><div class="login-card"><div class="login-header"><div class="login-icon"><i class="fas fa-lock"></i></div><h1>Créer votre nouveau mot de passe</h1><p>Remplacez le mot de passe provisoire avant de continuer.</p></div>
<form (ngSubmit)="submit()"><div class="form-group"><label>Nouveau mot de passe</label><div class="input-box"><i class="fas fa-lock"></i><input [type]="showPassword?'text':'password'" name="password" [(ngModel)]="password" autocomplete="new-password" required><i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" (click)="showPassword=!showPassword"></i></div></div>
@if(password){<div class="password-rules"><div [class.valid]="uppercase"><i class="fas" [class.fa-check-circle]="uppercase" [class.fa-circle]="!uppercase"></i> Une lettre majuscule</div><div [class.valid]="digit"><i class="fas" [class.fa-check-circle]="digit" [class.fa-circle]="!digit"></i> Un chiffre</div><div [class.valid]="symbol"><i class="fas" [class.fa-check-circle]="symbol" [class.fa-circle]="!symbol"></i> Un symbole spécial</div></div><div class="strength" [class.weak]="score<=1" [class.medium]="score===2" [class.strong]="score===3">Force : {{strength}}</div>}
<div class="form-group"><label>Confirmer le mot de passe</label><div class="input-box"><i class="fas fa-lock"></i><input [type]="showConfirmation?'text':'password'" name="confirmation" [(ngModel)]="confirmation" autocomplete="new-password" required><i class="fas" [class.fa-eye]="!showConfirmation" [class.fa-eye-slash]="showConfirmation" (click)="showConfirmation=!showConfirmation"></i></div></div>
@if(mismatch){<p class="login-error">Les mots de passe ne correspondent pas.</p>}@if(error){<p class="login-error">{{error}}</p>}<button type="submit" class="btn-login" [disabled]="!valid">{{loading?'Modification…':'Confirmer le mot de passe'}}</button></form></div></div>
