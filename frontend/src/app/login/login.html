<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="login-icon">
        <i class="fas fa-bus"></i>
      </div>

      <h1>ALSA Clean Fleet</h1>

      <p>
        Connectez-vous à votre espace administrateur
      </p>

    </div>


   <form (ngSubmit)="seConnecter()">

      <div class="form-group">

        <label>Login</label>

        <div class="input-box">

          <i class="fas fa-user"></i>

         <input type="text" name="login" [(ngModel)]="login" placeholder="admin" autocomplete="username" required>

        </div>

      </div>



     <div class="form-group">

      <label>Mot de passe</label>

        <div class="input-box">

         <i class="fas fa-lock"></i>

          <input [type]="afficherMotDePasse ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="********" autocomplete="current-password" required>
          <i class="fas"
             [class.fa-eye]="!afficherMotDePasse"
             [class.fa-eye-slash]="afficherMotDePasse"
             (click)="afficherMotDePasse = !afficherMotDePasse">
          </i>

    </div>

  </div>



     @if (messageErreur) {
       <p class="login-error">{{ messageErreur }}</p>
     }

     <button type="submit" class="btn-login" [disabled]="connexionEnCours">
        <i class="fas fa-sign-in-alt"></i>
        {{ connexionEnCours ? 'Connexion…' : 'Se connecter' }}
      </button>


    </form>


  </div>

</div>
