spring.application.name=alsa-clean-fleet

# ============================================
# PostgreSQL DataSource
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alsa_clean_fleet}
spring.datasource.username=${DB_USERNAME:alsa_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate
# ============================================
# Flyway owns schema changes; Hibernate only checks entity/schema compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# ============================================
# JWT
# Override JWT_SECRET in every deployed environment.
# ============================================
app.jwt.secret=${JWT_SECRET:alsa-clean-fleet-development-secret-change-me-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# ============================================
# Server
# ============================================
server.port=8080
