spring.application.name=alsa-clean-fleet

# ============================================
# MySQL DataSource
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/alsa_clean_fleet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Renseignez ici le mot de passe de votre instance MySQL si necessaire.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================================
# JWT
# Override JWT_SECRET in every deployed environment.
# ============================================
app.jwt.secret=${JWT_SECRET:alsa-clean-fleet-development-secret-change-me-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ============================================
# Server
# ============================================
server.port=8080
